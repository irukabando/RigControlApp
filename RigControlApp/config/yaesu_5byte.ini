# ==========================================================
# Yaesu 5-Byte Binary CAT Configuration (FT-847 / FT-857 / FT-1000MP)
# ==========================================================
[SERIAL]
PortName = COM3
BaudRate = 4800
DataBits = 8
Parity = None
StopBits = Two
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = YAESU_5BYTE
Terminator = None
FreqDigits = 8

[COMMANDS]
# VFO 切替 (Opcode 0x05: P1=00: VFO-A, P1=02: VFO-B)
VFO_A  = 00 00 00 00 05
VFO_B  = 00 00 00 02 05
# FT-1000, FT-1000MP, MarkV, MarkVField
YaesuModel = FT-1000MP

[MODES]
# Mode codes (Hex)
LSB      = 00
USB      = 01
CW       = 02
CW-R     = 03
AM       = 04
FM       = 06
DIG      = 08
DATA-USB = 08
PKT      = 0A

[BANDS]
# Band Up / Down commands for 5-byte CAT
1.9MHz  = 00 10 19 00 0A
3.5MHz  = 00 10 35 00 0A
7MHz    = 00 10 70 00 0A
10MHz   = 00 10 01 01 0A
14MHz   = 00 10 40 01 0A
18MHz   = 00 70 80 01 0A
21MHz   = 00 10 10 02 0A
24MHz   = 00 95 48 02 0A
28MHz   = 00 10 80 02 0A
50MHz   = 00 10 00 05 0A
144MHz  = 00 20 40 14 0A
430MHz  = 00 20 00 43 0A