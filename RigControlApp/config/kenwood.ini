# ==============================================================================
# Kenwood / ASCII CAT Configuration
# 基準リグ: TS-590 / TS-590G
#
# 【他機種への変更ガイド】
#  - TS-590 / TS-590G:
#      SM_GET = SM;   (TS-590 では SM0; を送ると ?; エラーになります)
#      PO_GET = SM;   (送信中の SM; が PO メーターになります)
#      RM_GET = RM;   (RM; を送ると SWR, COMP, ALC の3つの応答が連続返却されます)
#      SWR_GET = RM1; (一括返却内の SWR プレフィックス)
#      ALC_GET = RM3; (一括返却内の ALC プレフィックス)
#      ANT_GET_A = AN; ANT_SET_A = AN{0}99;
#      AntennaDigitIndex = 0
#  - TS-890 / TS-990:
#      # 一括返却ではないため RM_GET 行を削除またはコメントアウト
#      # RM_GET = 
#      SM_GET = SM0;  PO_GET = SM0;
#      SWR_GET = RM2; ALC_GET = RM1; (TS-990 では 1=ALC, 2=SWR と番号が逆転します)
#      ANT_GET_A = AN0; ANT_SET_A = AN0{0}99;
#      AntennaDigitIndex = 1
# ==============================================================================

[SERIAL]
PortName = COM3
BaudRate = 115200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = Kenwood
Terminator = ;
FreqDigits = 11
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 (11桁) ---
FA_GET = FA;
FB_GET = FB;
FA_SET = FA{0:D11};
FB_SET = FB{0:D11};

# --- VFO 選択 ---
VFO_A = FR0;FT0;
VFO_B = FR1;FT1;

# --- モード制御 ---
MD_GET_A = MD;
MD_GET_B = MD;
MD_SET_A = MD{0};
MD_SET_B = MD{0};

# --- アンテナ切り替え (TS-590: AN; / TS-990: AN0;) ---
ANT_GET_A = AN;
ANT_GET_B = AN;
ANT_SET_A = AN{0}99;
ANT_SET_B = AN{0}99;
AntennaDigitIndex = 0

# --- バンド切り替え (BD コマンド) ---
BAND_SET_A = BD{0};
BAND_SET_B = BD{0};

# --- 送受信 (PTT) ---
TX_ON = TX;
TX_OFF = RX;
TX_GET = IF;
IF_GET = IF;

# --- メーター読み出し ---
# TS-590 の Sメーター/POメーター読み出しは SM; (SM0; はエラー)
SM_GET = SM;
PO_GET = SM;

# TS-590 の RM; は SWR/COMP/ALC の3コマンドを一括返却します。
# RM_GET を定義するとドライバは自動的にマルチレスポンス一括受信モードで動作します。
RM_GET = RM;
MultiResponseCount = 3
SWR_GET = RM1;
ALC_GET = RM3;

# --- メーター種別切り替え ---
SM_SET = RM0;
PO_SET = RM0;
SWR_SET = RM1;
ALC_SET = RM3;

# --- AF ゲイン ---
AG_GET = AG0;
AG_SET = AG0{0:D3};

# --- アンテナチューナー (ATU) ---
TUNER_GET = AC;
TUNER_START = AC111;
TUNER_ON = AC110;
TUNER_OFF = AC000;
TUNER_SET = AC{0:D3};

# --- フィルター帯域幅 (Passband Width) ---
BW_GET_A = FW;
BW_GET_B = FW;
BW_GET = FW;
BW_SET_A = FW{0:D4};
BW_SET_B = FW{0:D4};
BW_SET = FW{0:D4};

[MODES]
LSB = 1
USB = 2
CW = 3
FM = 4
AM = 5
FSK = 6
CW-R = 7
DATA-USB = 2
DATA-LSB = 1

[ANTENNAS]
1 = 1
2 = 2
3 = 3
4 = 4

[BANDS]
1.9MHz = 00
3.5MHz = 01
7MHz = 02
10MHz = 03
14MHz = 04
18MHz = 05
21MHz = 06
24MHz = 07
28MHz = 08
50MHz = 09
GENE = 10

[FILTERS]
250Hz = 0250
500Hz = 0500
1.0kHz = 1000
1.8kHz = 1800
2.4kHz = 2400
2.7kHz = 2700
3.0kHz = 3000

[METERS]
SMeterMax = 30
PowerMeterMax = 30
SwrMeterMax = 30
AlcMeterMax = 30