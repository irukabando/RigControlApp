# ==============================================================================
# Kenwood / ASCII CAT Configuration
# ==============================================================================

[SERIAL]
PortName = COM3
BaudRate = 115200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = ASCII
Terminator = ;
FreqDigits = 11
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = FA;
FB_GET = FB;
FA_SET = FA{0:D11};
FB_SET = FB{0:D11};

# --- VFO 選択 ---
VFO_A = FR0;
VFO_B = FR1;

# --- モード制御 ---
MD_GET_A = MD;
MD_GET_B = MD;
MD_SET_A = MD{0};
MD_SET_B = MD{0};

# --- アンテナ切替 ---
ANT_SET_A = AN{0};
ANT_SET_B = AN{0};

# --- バンド切替 (BD コマンドを使用) ---
BAND_SET_A = BD{0};
BAND_SET_B = BD{0};

# --- その他制御 ---
TX_ON = TX;
TX_OFF = RX;
IF_GET = IF;
SM_GET = SM0;
AG_GET = AG0;
AG_SET = AG0{0:D3};

[MODES]
LSB = 1
USB = 2
CW = 3
FM = 4
AM = 5
FSK = 6
CW-R = 7
DATA-USB = 2
DATA-LSB = 1

[ANTENNAS]
1 = 1
2 = 2
3 = 3
4 = 4

[BANDS]
1.9MHz = 00
3.5MHz = 01
7MHz = 03
10MHz = 04
14MHz = 05
18MHz = 06
21MHz = 07
24MHz = 08
28MHz = 09
50MHz = 10
144MHz = 14
430MHz = 15