# ==============================================================================
# Yaesu 5-Byte Binary CAT Configuration (FT-1000 / FT-1000MP / Mark-V)
# ==============================================================================

[SERIAL]
PortName = COM6
BaudRate = 4800
DataBits = 8
Parity = None
StopBits = Two
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = YaesuBinary
Terminator = 
PollIntervalMs = 500

[COMMANDS]
# YaesuModel の値は右を正確に記載: FT-1000, FT-1000MP, MarkV, MarkVField
YaesuModel = FT-1000MP
VFO_A = 00 00 00 00 05
VFO_B = 00 00 00 02 05
MD_SET_A = 00 00 00 {0} 0C
MD_SET_B = 00 00 00 {0} 0C

# --- メーター取得コマンド ---
# Sメーター(SM_GET)に加えて以下を追加可能
PO_GET = 
SWR_GET = 
ALC_GET = 

# --- PTT (送受信状態) 取得 ---
TX_GET = 

# --- アンテナチューナー (ATU) ---
TUNER_GET = 
TUNER_ON = 
TUNER_OFF = 
TUNER_SET = 

# --- フィルタ帯域幅 (Passband Width) ---
BW_GET_A = 
BW_GET_B = 
BW_GET = 
BW_SET_A = 
BW_SET_B = 
BW_SET = 

# FA_GET, FB_GET, FA_SET, FB_SET はコードにべた書きしているので，設定できません
# モードの取得，アンテナ制御はできません
# バンドの切り替えは，OA コマンドで周波数を指定して切り替えます

[MODES]
LSB = 00
USB = 01
CW = 02
CW-R = 03
AM = 04
FM = 06
RTTY = 08

[ANTENNAS]
1 = 00
2 = 01
3 = 02
4 = 03

[BANDS]
# 周波数セットコマンド 0A を使用
# 周波数 (Hz) を入力
1.9MHz = 1910000
3.5MHz = 3535000
7MHz = 7074000
10MHz = 10136000
14MHz = 14074000
18MHz = 18100000
21MHz = 21074000
24MHz = 24915000
28MHz = 28074000
50MHz = 50313000
144MHz = 144100000
430MHz = 430100000

# --- フィルタ帯域の段階設定セクション ---
# [画面の表示名] = [リグに送信するコードまたは数値(Hz/ステップ)]
[FILTERS]
250Hz = 250
500Hz = 500
1.8kHz = 1800
2.4kHz = 2400
2.8kHz = 2800
3.0kHz = 3000