# ==============================================================================
# Yaesu 5-Byte Binary CAT Configuration
# 基準リグ: FT-1000MP
#
# 【他機種への変更ガイド】
#  - YaesuModel:
#      FT-1000: 3バイトバイナリ周波数デコード
#      FT-1000MP: 4バイトバイナリ周波数デコード (周波数 = raw * 0.625)
#      MarkV: 4バイトBCDデコード
#      MarkVField: 4バイトバイナリ周波数デコード (周波数 = raw * 10)
#  - アンテナ端子切り替え:
#      FT-1000MP には CAT 経由でアンテナ端子(ANT A/B)を切り替えるコマンドは存在しません。
#      (マニュアル p.88 の 8D はスキャンスキップ設定コマンドです)
#      そのため ANT_SET は NONE に設定します。
# ==============================================================================

[SERIAL]
PortName = COM6
BaudRate = 4800
DataBits = 8
Parity = None
StopBits = Two
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = YaesuBinary
Terminator = 
PollIntervalMs = 500

[COMMANDS]
# 機種モデル指定: FT-1000, FT-1000MP, MarkV, MarkVField
YaesuModel = FT-1000MP

# --- ステータス一括読み出し (00 00 00 03 10 = VFO A, B 32バイト読出) ---
STATUS_GET = 00 00 00 03 10

# --- VFO 選択 ---
VFO_A = 00 00 00 00 05
VFO_B = 00 00 00 02 05

# --- モード設定 (VFO-A: 0C, VFO-B: 8C) ---
MD_SET_A = 00 00 00 {0} 0C
MD_SET_B = 00 00 00 {0} 8C

# --- アンテナ設定 (FT-1000MP には CAT 切替コマンドが存在しないため NONE) ---
ANT_SET_A = NONE
ANT_SET_B = NONE

# --- メーター読み出しパラメータ (F7 コマンドの第1バイト P4 に格納) ---
# 00: Sメーター, 80: POメーター, 85: SWRメーター, 81: ALCメーター
SM_GET = 00
PO_GET = 80
SWR_GET = 85
ALC_GET = 81

# --- 送受信 (PTT) ---
TX_ON = 00 00 00 01 0F
TX_OFF = 00 00 00 00 0F

# --- アンテナチューナー (完全な5バイトパケット) ---
TUNER_START = 00 00 00 00 82
TUNER_ON = 00 00 00 01 81
TUNER_OFF = 00 00 00 00 81

[MODES]
LSB = 00
USB = 01
CW = 02
CW-R = 03
AM = 04
FM = 06
RTTY = 08

[ANTENNAS]
1 = 00
2 = 01
3 = 02

[BANDS]
# ダイレクトバンド設定 (Hz)
1.9MHz = 1910000
3.5MHz = 3535000
7MHz = 7074000
10MHz = 10136000
14MHz = 14074000
18MHz = 18100000
21MHz = 21074000
24MHz = 24915000
28MHz = 28074000
50MHz = 50313000
144MHz = 144100000
430MHz = 430100000

[FILTERS]
250Hz = 250
500Hz = 500
1.8kHz = 1800
2.4kHz = 2400
2.8kHz = 2800
3.0kHz = 3000

[METERS]
SMeterMax = 255
PowerMeterMax = 255
SwrMeterMax = 255
AlcMeterMax = 255