# ==============================================================================
# Yaesu 5-Byte Binary CAT Configuration (FT-1000 / FT-1000MP / Mark-V)
# ==============================================================================

[SERIAL]
PortName = COM6
BaudRate = 4800
DataBits = 8
Parity = None
StopBits = Two
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = YaesuBinary
Terminator = None
PollIntervalMs = 500

[COMMANDS]
# 正確に記載: FT-1000, FT-1000MP, MarkV, MarkVField
YaesuModel = MarkV
VFO_A = 00 00 00 00 05
VFO_B = 00 00 00 02 05
MD_SET_A = 00 00 00 {0} 0C
MD_SET_B = 00 00 00 {0} 0C
ANT_SET_A = 00 00 00 {0} 28
ANT_SET_B = 00 00 00 {0} 28

[MODES]
LSB = 00
USB = 01
CW = 02
CW-R = 03
AM = 04
FM = 06
RTTY = 08

[ANTENNAS]
1 = 00
2 = 01
3 = 02
4 = 03

[BANDS]
# 周波数セットコマンド 0A を使用
1.9MHz = 1910000
3.5MHz = 3535000
7MHz = 7074000
10MHz = 10136000
14MHz = 14074000
18MHz = 18100000
21MHz = 21074000
24MHz = 24915000
28MHz = 28074000
50MHz = 50313000
144MHz = 144100000
430MHz = 430100000