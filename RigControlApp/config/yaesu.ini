# ==============================================================================
# Yaesu CAT Configuration
# 基準リグ: FTDX9000
#
# 【他機種への変更ガイド】
#  - FTDX9000 / FT-2000 / FTDX5000 / FTDX3000:
#      FreqDigits = 8
#      FA_SET = FA{0:D8};
#      FB_SET = FB{0:D8};
#      PO_GET  = RM08;  (2桁指定、応答は RM08xxx;)
#      SWR_GET = RM09;  (2桁指定、応答は RM09xxx;)
#      ALC_GET = RM07;  (2桁指定、応答は RM07xxx;)
#      BW_SET_A = SH0{0};
#  - FTDX101 / FT-991A / FT-710 / FTDX10:
#      FreqDigits = 9   (周波数フォーマットが9桁: 014250000)
#      FA_SET = FA{0:D9};
#      FB_SET = FB{0:D9};
#      PO_GET  = RM5;   (1桁指定、応答は RM5xxx000;)
#      SWR_GET = RM6;   (1桁指定、応答は RM6xxx000;)
#      ALC_GET = RM4;   (1桁指定、応答は RM4xxx000;)
#      BW_SET_A = SH00{0};
#      ※ FT-991A / FT-710 でアンテナ切り替えがない場合は ANT_GET_A = NONE, ANT_SET_A = NONE に設定
# ==============================================================================

[SERIAL]
PortName = COM4
BaudRate = 4800
DataBits = 8
Parity = None
StopBits = Two
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = Yaesu
Terminator = ;
# 8: FTDX9000, FT-2000, FTDX3000, FTDX5000
# 9: FTDX101, FT-991, FT-710, FTDX10, FTX-1
FreqDigits = 8
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 (FTDX9000は8桁) ---
FA_GET = FA;
FB_GET = FB;
FA_SET = FA{0:D8};
FB_SET = FB{0:D8};

# --- VFO 選択 (VS0: MAIN, VS1: SUB) ---
VFO_A = VS0;
VFO_B = VS1;

# --- モード制御 (VFO-A: MD0, VFO-B: MD1) ---
MD_GET_A = MD0;
MD_GET_B = MD1;
MD_SET_A = MD0{0};
MD_SET_B = MD1{0};

# --- アンテナ制御 (FTDX9000: AN0/AN1, FT-991A等はNONE) ---
ANT_SET_A = AN0{0};
ANT_SET_B = AN1{0};
ANT_GET_A = AN0;
ANT_GET_B = AN1;

# --- バンド切り替え (BS コマンド: BS00; ~ BS11;) ---
BAND_SET_A = BS{0};
BAND_SET_B = BS{0};

# --- 送受信 (PTT) ---
TX_ON = TX1;
TX_OFF = TX0;
TX_GET = TX;
IF_GET = IF;

# --- メーター読み出し (FTDX9000は RM08/RM09/RM07, FTDX101系は RM5/RM6/RM4) ---
SM_GET = SM0;
PO_GET = RM08;
SWR_GET = RM09;
ALC_GET = RM07;

# --- メーター表示切り替え ---
SM_SET = MS0;
PO_SET = MS0;
SWR_SET = MS3;
ALC_SET = MS4;

# --- AF ゲイン ---
AG_GET = AG0;
AG_SET = AG0{0:D3};

# --- アンテナチューナー (ATU) ---
TUNER_GET = AC;
TUNER_START = AC002;
TUNER_ON = AC001;
TUNER_OFF = AC000;
TUNER_SET = AC{0:D3};

# --- フィルター通過帯域幅 (Passband Width) ---
BW_GET_A = SH0;
BW_GET_B = SH1;
BW_GET = SH;
BW_SET_A = SH0{0};
BW_SET_B = SH1{0};
BW_SET = SH{0};

[MODES]
LSB = 1
USB = 2
CW = 3
FM = 4
AM = 5
RTTY-LSB = 6
CW-R = 7
DATA-LSB = 8
DATA-USB = C
DATA-FM = A
FM-N = B
RTTY-USB = 9

[ANTENNAS]
1 = 1
2 = 2
3 = 3
4 = 4

[BANDS]
# FTDX9000 BS コマンド
1.9MHz = 00
3.5MHz = 01
7MHz = 03
10MHz = 04
14MHz = 05
18MHz = 06
21MHz = 07
24MHz = 08
28MHz = 09
50MHz = 10
144MHz = 14
430MHz = 15

[FILTERS]
300Hz = 00
500Hz = 01
1.2kHz = 04
1.8kHz = 07
2.4kHz = 09
3.0kHz = 12

[METERS]
SMeterMax = 255
PowerMeterMax = 255
SwrMeterMax = 255
AlcMeterMax = 255