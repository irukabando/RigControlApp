# ==============================================================================
# Yaesu CAT Configuration (New ASCII Protocol: FT-991A, FT-710, FTDX10 等)
# ==============================================================================

[SERIAL]
PortName = COM4
BaudRate = 38400
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = Yaesu
Terminator = ;
# FA_SET の桁数も書き換えてください
# 8: FT-2000, FTDX3000, FTDX5000, FTDX9000
# 9: FT-991, FT-710, FTX-1, FTDX101, FTDX10
FreqDigits = 8
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = FA;
FB_GET = FB;
FA_SET = FA{0:D8};
FB_SET = FB{0:D8};

# --- VFO 選択 ---
VFO_A = VS0;
VFO_B = VS1;

# --- モード制御 (VFO-A: MD0, VFO-B: MD1) ---
MD_GET_A = MD0;
MD_GET_B = MD1;
MD_SET_A = MD0{0};
MD_SET_B = MD1{0};

# --- アンテナ制御 (VFO-A: AN0, VFO-B: AN1) ---
ANT_SET_A = AN0{0};
ANT_SET_B = AN1{0};
ANT_GET_A = AN0;
ANT_GET_B = AN1;

# --- バンド切替 (BS コマンド) ---
BAND_SET_A = BS{0};
BAND_SET_B = BS{0};

# --- その他制御 (PTT / S-Meter / AF Gain / State) ---
TX_ON = TX1;
TX_OFF = TX0;

# --- PTT (送受信状態) 取得 ---
TX_GET = TX;

IF_GET = IF;

# --- メーター取得コマンド ---
# Sメーター(SM_GET)に加えて以下を追加可能
SM_GET = SM0;
PO_GET = RM4;
SWR_GET = RM1;
ALC_GET = RM3;

AG_GET = AG0;
AG_SET = AG0{0:D3};

# --- アンテナチューナー (ATU) ---
TUNER_GET = AC;
TUNER_ON = AC001;
TUNER_OFF = AC000;
TUNER_SET = AC{0:D3};

# --- フィルタ帯域幅 (Passband Width) ---
BW_GET_A = SH0;
BW_GET_B = SH1;
BW_GET = SH;
BW_SET_A = SH0{0};
BW_SET_B = SH1{0};
BW_SET = SH{0};

[MODES]
LSB = 1
USB = 2
CW = 3
FM = 4
AM = 5
RTTY-LSB = 6
CW-R = 7
DATA-LSB = 8
DATA-USB = 9
DATA-FM = A
FM-N = B
RTTY-USB = C

[ANTENNAS]
1 = 1
2 = 2
3 = 3
4 = 4

[BANDS]
# Yaesu BS コマンドのバンド識別コード (BS00; - BS15;)
1.9MHz = 00
3.5MHz = 01
7MHz = 03
10MHz = 04
14MHz = 05
18MHz = 06
21MHz = 07
24MHz = 08
28MHz = 09
50MHz = 10
144MHz = 14
430MHz = 15

# --- フィルタ帯域の段階設定セクション ---
# [画面の表示名] = [リグに送信するコードまたは数値(Hz/ステップ)]
[FILTERS]
300Hz = 00
500Hz = 01
1.2kHz = 04
1.8kHz = 07
2.4kHz = 09
3.0kHz = 12

[METERS]
SMeterMax = 255
PowerMeterMax = 255
SwrMeterMax = 255
AlcMeterMax = 255