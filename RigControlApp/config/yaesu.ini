# ==============================================================================
# Yaesu CAT Configuration (New ASCII Protocol: FT-991A, FT-710, FTDX10 等)
# ==============================================================================

[SERIAL]
PortName = COM4
BaudRate = 38400
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = ASCII
Terminator = ;
FreqDigits = 9
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = FA;
FB_GET = FB;
FA_SET = FA{0:D9};
FB_SET = FB{0:D9};

# --- VFO 選択 ---
VFO_A = VS0;
VFO_B = VS1;

# --- モード制御 (VFO-A: MD0, VFO-B: MD1) ---
MD_GET_A = MD0;
MD_GET_B = MD1;
MD_SET_A = MD0{0};
MD_SET_B = MD1{0};

# --- アンテナ切替 (VFO-A: AN0, VFO-B: AN1) ---
ANT_SET_A = AN0{0};
ANT_SET_B = AN1{0};

# --- バンド切替 (BS コマンド) ---
BAND_SET_A = BS{0};
BAND_SET_B = BS{0};

# --- その他制御 (PTT / S-Meter / AF Gain / State) ---
TX_ON = TX1;
TX_OFF = TX0;
IF_GET = IF;
SM_GET = SM0;
AG_GET = AG0;
AG_SET = AG0{0:D3};

[MODES]
LSB = 1
USB = 2
CW = 3
FM = 4
AM = 5
RTTY-LSB = 6
CW-R = 7
DATA-LSB = 8
DATA-USB = 9
DATA-FM = A
FM-N = B
RTTY-USB = C

[ANTENNAS]
1 = 1
2 = 2
3 = 3
4 = 4

[BANDS]
# Yaesu BS コマンドのバンド識別コード (BS00; - BS15;)
1.9MHz = 00
3.5MHz = 01
7MHz = 03
10MHz = 04
14MHz = 05
18MHz = 06
21MHz = 07
24MHz = 08
28MHz = 09
50MHz = 10
144MHz = 14
430MHz = 15