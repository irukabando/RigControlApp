# ==========================================================
# Yaesu CAT Configuration (e.g., FT-991A, FT-710, FTDX10/101)
# ==========================================================
[SERIAL]
PortName = COM4
BaudRate = 38400
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = ASCII
Terminator = ;
# FT-991A / FT-710 = 9 digits for Hz, FTDX9000 = 8
FreqDigits = 9

[COMMANDS]
FA_GET = FA;
# FTDX9000 = FA{0:D8};
FA_SET = FA{0:D9};
FB_GET = FB;
# FTDX9000 = FB{0:D8};
FB_SET = FB{0:D9};
MD_GET = MD0;
MD_SET = MD0{0};
IF_GET = IF;
SM_GET = SM0;
# VFO 切替 (VS0: VFO-A / Main, VS1: VFO-B / Sub)
VFO_A  = VS0;
VFO_B  = VS1;
# アンテナ切替 (AN01: ANT1, AN02: ANT2, AN03: ANT3, AN04: ANT4)
ANT_1  = AN01;
ANT_2  = AN02;
ANT_3  = AN03;
ANT_4  = AN04;

[MODES]
# Yaesu mode numbers (2 digits in protocol, configured here as key-value)
LSB      = 1
USB      = 2
CW       = 3
FM       = 4
AM       = 5
RTTY-LSB = 6
CW-L     = 7
DATA-LSB = 8
DATA-USB = 9
DATA-FM  = A
FM-N     = B
PSK      = C

[BANDS]
# Yaesu Band Select (BSxx;)
1.9MHz  = BS00;
3.5MHz  = BS01;
7MHz    = BS03;
10MHz   = BS04;
14MHz   = BS05;
18MHz   = BS06;
21MHz   = BS07;
24MHz   = BS08;
28MHz   = BS09;
50MHz   = BS10;
144MHz  = BS11;
430MHz  = BS12;