# ==============================================================================
# Icom CI-V Configuration
# 基準リグ: IC-7100
#
# 【他機種への変更ガイド】
#  - IC-7100:
#      CivRigAddress = 88
#      ANT_GET_A = NONE (HF/50MHz用ANT1と144/430MHz用ANT2端子はバンド固定で切替コマンドなし)
#      ANT_SET_A = NONE
#  - IC-7300:
#      CivRigAddress = 94
#      ANT_GET_A = NONE (アンテナ端子切替機能なし)
#      ANT_SET_A = NONE
#  - IC-7610:
#      CivRigAddress = 98
#      VFO_A = 07 D0    (または 07 00)
#      VFO_B = 07 D1    (または 07 01)
#      ANT_GET_A = 12 00 (ANT1/ANT2/RX-ANT 切り替え対応)
#      ANT_SET_A = 12 {0} 00
#  - IC-705:
#      CivRigAddress = A4
#      ANT_GET_A = NONE (アンテナ端子切替機能なし)
#      ANT_SET_A = NONE
# ==============================================================================

[SERIAL]
PortName = COM5
BaudRate = 19200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = CIV
# IC-7100=88, IC-7300=94, IC-7610=98, IC-705=A4
CivRigAddress = 88
CivControllerAddress = E0
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = 03
FB_GET = 03
FA_SET = 05
FB_SET = 05

# --- VFO 選択 (IC-7610 の場合は 07 D0 / 07 D1 も使用可能) ---
VFO_A = 07 00
VFO_B = 07 01

# --- モード制御 ---
MD_GET_A = 04
MD_GET_B = 04
MD_SET_A = 06 {0}
MD_SET_B = 06 {0}

# --- アンテナ制御 (IC-7100 / IC-7300 / IC-705 は端子切替なしのため NONE, IC-7610 は 12) ---
ANT_GET_A = NONE
ANT_GET_B = NONE
ANT_SET_A = NONE
ANT_SET_B = NONE

# --- バンド切り替え (CI-V バンドスタッキングレジスタコード) ---
BAND_SET_A = 01 {0}
BAND_SET_B = 01 {0}

# --- 送受信 (PTT) ---
TX_ON = 1C 00 01
TX_OFF = 1C 00 00
TX_GET = 1C 00

# --- メーター読み出し (BCD 0000~0255) ---
SM_GET = 15 02
PO_GET = 15 11
SWR_GET = 15 12
ALC_GET = 15 13

# --- AF ゲイン ---
AG_GET = 14 01
AG_SET = 14 01

# --- アンテナチューナー (ATU) ---
TUNER_GET = 1C 01
TUNER_START = 1C 01 02
TUNER_ON = 1C 01 01
TUNER_OFF = 1C 01 00

# --- フィルター帯域幅 (Passband Width) ---
BW_GET_A = 1A 03
BW_GET_B = 1A 03
BW_GET = 1A 03
BW_SET_A = 1A 03 {0}
BW_SET_B = 1A 03 {0}
BW_SET = 1A 03 {0}

[MODES]
LSB = 00
USB = 01
AM = 02
CW = 03
RTTY = 04
FM = 05
WFM = 06
CW-R = 07
RTTY-R = 08
DV = 17
DATA-USB = 01

[ANTENNAS]
1 = 00
2 = 01
3 = 02
4 = 03

[BANDS]
1.9MHz = 01
3.5MHz = 02
7MHz = 03
10MHz = 04
14MHz = 05
18MHz = 06
21MHz = 07
24MHz = 08
28MHz = 09
50MHz = 10
WFM = 11
Air = 12
144MHz = 13
430MHz = 14

[FILTERS]
250Hz = 250
500Hz = 500
1.2kHz = 1200
1.8kHz = 1800
2.4kHz = 2400
2.8kHz = 2800
3.0kHz = 3000

[METERS]
SMeterMax = 255
PowerMeterMax = 255
SwrMeterMax = 255
AlcMeterMax = 255