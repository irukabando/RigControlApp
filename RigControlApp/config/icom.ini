# ==============================================================================
# Icom CI-V Configuration (IC-7300, IC-7610, IC-705 等)
# ==============================================================================

[SERIAL]
PortName = COM5
BaudRate = 19200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = CIV
CivRigAddress = 94
CivControllerAddress = E0
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = 03
FB_GET = 03
FA_SET = 05
FB_SET = 05

# --- VFO 選択 ---
VFO_A = 07 00
VFO_B = 07 01

# --- モード制御 ---
MD_GET_A = 04
MD_GET_B = 04
MD_SET_A = 06 {0} 01
MD_SET_B = 06 {0} 01

# --- アンテナ切替 ---
ANT_SET_A = 12 0{0}
ANT_SET_B = 12 0{0}

# --- バンド切替 (Icom CI-V 独自: 01 バンドスタッキングレジスタ切替) ---
BAND_SET_A = 01 {0}
BAND_SET_B = 01 {0}

# --- その他制御 ---
TX_ON = 1C 00 01
TX_OFF = 1C 00 00
SM_GET = 15 02
AG_GET = 14 01
AG_SET = 14 01

[MODES]
LSB = 00
USB = 01
AM = 02
CW = 03
RTTY = 04
FM = 05
CW-R = 07
RTTY-R = 08
DATA-USB = 01

[ANTENNAS]
1 = 0
2 = 1
3 = 2
4 = 3

[BANDS]
# Icom CI-V 01 コマンドのバンドレジスタコード (16進数)
1.9MHz = 00
3.5MHz = 01
7MHz = 02
10MHz = 03
14MHz = 04
18MHz = 05
21MHz = 06
24MHz = 07
28MHz = 08
50MHz = 09
144MHz = 10
430MHz = 11