# ==============================================================================
# Icom CI-V Configuration (IC-7300, IC-7610, IC-705 等)
# ==============================================================================

[SERIAL]
PortName = COM5
BaudRate = 19200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
Type = CIV
CivRigAddress = 94
CivControllerAddress = E0
PollIntervalMs = 500

[COMMANDS]
# --- 周波数制御 ---
FA_GET = 03
FB_GET = 03
FA_SET = 05
FB_SET = 05

# --- VFO 選択 ---
VFO_A = 07 00
VFO_B = 07 01

# --- モード制御 ---
MD_GET_A = 04
MD_GET_B = 04
MD_SET_A = 06 {0}
MD_SET_B = 06 {0}

# --- アンテナ制御 ---
ANT_GET_A = 12
ANT_GET_B = 12
ANT_SET_A = 12 {0} 00
ANT_SET_B = 12 {0} 00

# --- バンド切替 (Icom CI-V 独自: 01 バンドスタッキングレジスタ切替) ---
BAND_SET_A = 01 {0}
BAND_SET_B = 01 {0}

# --- その他制御 ---
TX_ON = 1C 00 01
TX_OFF = 1C 00 00

# --- PTT (送受信状態) 取得 ---
TX_GET = 1C 00

# --- メーター取得コマンド ---
# Sメーター(SM_GET)に加えて以下を追加可能
SM_GET = 15 02
PO_GET = 15 11
SWR_GET = 15 12
ALC_GET = 15 13

AG_GET = 14 01
AG_SET = 14 01

# --- アンテナチューナー (ATU) ---
TUNER_GET = 1C 01
TUNER_ON = 1C 01 01
TUNER_OFF = 1C 01 00
TUNER_SET = 1C 01 0{0}

# --- フィルタ帯域幅 (Passband Width) ---
BW_GET_A = 1A 03
BW_GET_B = 1A 03
BW_GET = 1A 03
BW_SET_A = 1A 03 {0}
BW_SET_B = 1A 03 {0}
BW_SET = 1A 03 {0}

[MODES]
LSB = 00
USB = 01
AM = 02
CW = 03
RTTY = 04
FM = 05
CW-R = 07
RTTY-R = 08
DATA-USB = 01

[ANTENNAS]
1 = 00
2 = 01
3 = 02
4 = 03

[BANDS]
# Icom CI-V 01 コマンドのバンドレジスタコード (16進数)
1.9MHz = 00
3.5MHz = 01
7MHz = 02
10MHz = 03
14MHz = 04
18MHz = 05
21MHz = 06
24MHz = 07
28MHz = 08
50MHz = 09
144MHz = 10
430MHz = 11

# --- フィルタ帯域の段階設定セクション ---
# [画面の表示名] = [リグに送信するコードまたは数値(Hz/ステップ)]
[FILTERS]
250Hz = 250
500Hz = 500
1.2kHz = 1200
1.8kHz = 1800
2.4kHz = 2400
2.8kHz = 2800
3.0kHz = 3000