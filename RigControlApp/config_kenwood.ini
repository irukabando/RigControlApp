# ==========================================================
# Kenwood CAT Configuration (e.g., TS-590SG, TS-890, TS-990)
# ==========================================================
[SERIAL]
PortName = COM3
BaudRate = 115200
DataBits = 8
Parity = None
StopBits = One
DtrEnable = True
RtsEnable = True
ReadTimeoutMs = 1000
WriteTimeoutMs = 1000

[PROTOCOL]
# Type: ASCII or CIV
Type = ASCII
# Terminator for ASCII commands
Terminator = ;
# Frequency digit length (TS-590 is 11 digits Hz)
FreqDigits = 11

[COMMANDS]
# ASCII Command templates ({0}=Freq/Param, {1}=Subparam)
FA_GET = FA;
FA_SET = FA{0:D11};
FB_GET = FB;
FB_SET = FB{0:D11};
MD_GET = MD;
MD_SET = MD{0};
IF_GET = IF;
SM_GET = SM0;
# VFO 切替 (FR/FTによる送受信VFOの切り替え)
VFO_A  = FR0;FT0;
VFO_B  = FR1;FT1;
ANT_1  = AN199;
ANT_2  = AN299;
ANT_3  = AN399;
ANT_4  = AN499;

[MODES]
# Name to Mode Code mapping
LSB  = 1
USB  = 2
CW   = 3
FM   = 4
AM   = 5
FSK  = 6
CW-R = 7

[BANDS]
# Kenwood Band Direct Selection (BNxx;)
1.9MHz  = BN00;
3.5MHz  = BN01;
7MHz    = BN02;
10MHz   = BN03;
14MHz   = BN04;
18MHz   = BN05;
21MHz   = BN06;
24MHz   = BN07;
28MHz   = BN08;
50MHz   = BN09;
144MHz  = BN10;
430MHz  = BN11;